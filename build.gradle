plugins {
    id 'java-library'
    id 'io.qameta.allure' version '2.11.2'
}

repositories {
    mavenCentral()
}



allure {
    report {
        version.set("2.21.0")
    }
    adapter {
        aspectjWeaver.set(true)
        frameworks {
            junit5 {
                adapterVersion.set("2.21.0")
            }
        }
    }
}


dependencies {
    testImplementation ("com.codeborne:selenide:6.19.1")
    testImplementation("org.junit.jupiter:junit-jupiter:5.11.4")
    testImplementation ("org.slf4j:slf4j-simple:2.0.7")
    testImplementation("com.github.javafaker:javafaker:1.0.2")
     testImplementation("io.qameta.allure:allure-selenide:2.21.0")

}

tasks.withType(Test) {
    useJUnitPlatform()
    systemProperties(System.getProperties())

    testLogging {
        lifecycle {
            events "started", "skipped", "failed", "standard_error", "standard_out"
            exceptionFormat "short"
        }
   }
}


task required_test(type: Test) {
    useJUnitPlatform {
        includeTags("required")
    }
}

task negative_test(type: Test) {
    useJUnitPlatform {
        includeTags("negative")
    }
}

    task simple_test(type: Test) {
    useJUnitPlatform {
        includeTags("simple")
    }
}